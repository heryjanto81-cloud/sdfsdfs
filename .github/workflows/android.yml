name: Build Android APK (Argon Studio v12.5 Pro)

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Prepare Environment Files (.env & .env.example)
        run: |
          if [ ! -f ".env.example" ]; then
            echo "# GEMINI_API_KEY=MY_GEMINI_API_KEY" > .env.example
          fi
          if [ ! -f ".env" ]; then
            cp .env.example .env
          fi

      - name: Setup Android SDK (API 36 & 36.1)
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "platforms;android-36.1" "build-tools;36.0.0" || true
          if [ ! -d "$ANDROID_HOME/platforms/android-36.1" ]; then
            echo "Fallback to compileSdk = 36 if android-36.1 is unavailable on runner"
            sed -i 's/compileSdk { version = release(36) { minorApiLevel = 1 } }/compileSdk = 36/g' app/build.gradle.kts
          fi

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Restore or Generate Debug Keystore
        run: |
          rm -f debug.keystore
          if [ -f "debug.keystore.base64" ]; then
            base64 -di debug.keystore.base64 > debug.keystore || true
          fi
          if ! keytool -list -keystore debug.keystore -storepass android >/dev/null 2>&1; then
            rm -f debug.keystore
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --no-configuration-cache --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Argon-Studio-v12.5-Pro-APK
          path: app/build/outputs/apk/debug/*.apk
